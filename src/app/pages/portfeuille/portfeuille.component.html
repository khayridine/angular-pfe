<div *ngIf="operations.length > 0; else noData">
  <div style="margin-bottom: 30px;">
    <span class="back-icon" (click)="goBackWithFlash()" style="cursor: pointer; margin-left: 20px; font-size: 20px; color: #2c3e50;">
      <i class="fas fa-arrow-left"></i> <!-- Icône flèche de FontAwesome -->
    </span>
  </div>
  
  <table style="width: 100%; border-collapse: collapse; background-color: #fff; border-radius: 8px; overflow: hidden;">
    <thead style="background-color: #2c3e50; color: white;">
      <tr style="text-align: center;">
        <th style="padding: 12px;">ID</th>
        <th style="padding: 12px;">Type</th>
        <th style="padding: 12px;">Date</th>
        <th style="padding: 12px;">Montant (€)</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let op of operations" style="text-align: center;">
        <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ op.id }}</td>
        <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ op.type }}</td>
        <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ op.date }}</td>
        <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ op.montant | number: '1.2-2' }} €</td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #noData>
  <p style="text-align: center; color: #999;">Aucune opération disponible.</p>
</ng-template>

<!-- Affichage du graphique des opérations -->
<div *ngIf="operations.length > 0" style="margin-top: 40px;">
  
  <app-title [label]="'Répartition des opérations par type'"></app-title>
  <div style="max-width: 600px; margin: 0 auto;">
    <canvas *ngIf="isBrowser" baseChart
      [data]="chartData"
      [type]="chartType"
      [options]="chartOptions">
    </canvas>
  </div>
</div>

<!-- Affichage des prix des crypto-monnaies -->
<div *ngIf="cryptoPrices.bitcoin && cryptoPrices.ethereum" style="margin-top: 40px;">
  
  <app-title [label]="'Prix des Crypto-monnaies'"></app-title>
  <p style="text-align: center;">Bitcoin (BTC): ${{ cryptoPrices.bitcoin?.usd | number:'1.0-0' }}</p>
  <p style="text-align: center;">Ethereum (ETH): ${{ cryptoPrices.ethereum?.usd | number:'1.0-0' }}</p>
</div>
