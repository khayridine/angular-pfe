<div class="container mt-5">
  <div class="card profile-card shadow-lg p-4">
    <div class="row g-4 align-items-center">
      <span class="back-icon" (click)="goBackWithFlash()">
        <i class="fas fa-arrow-left"></i> <!-- Icône flèche de FontAwesome -->
      </span>
      
      <div class="col-md-3 text-center">
        <!-- Avatar avec sélection d'image -->
        <img [src]="getAvatarPreview()" class="img-fluid rounded-circle profile-img" alt="Avatar"
          (click)="avatarInput.click()" />

        <input type="file" id="avatar" (change)="onAvatarSelected($event)" class="d-none" #avatarInput />

      </div>

      <div class="col-md-9">
        <h3 class="mb-3" style="display: inline-block;"> <!-- Pour que le titre et l'icône soient alignés sur la même ligne -->
          <span class="welcome-text">Bienvenue, {{ user.nom }} {{ user.prenom }}</span>
        </h3>
        <ul class="list-group list-group-flush">
          <li class="list-group-item"><strong>Email :</strong> {{ user.email }}</li>
          <li class="list-group-item"><strong>Téléphone :</strong> {{ user.num_tel }}</li>
          <li class="list-group-item"><strong>ID Utilisateur :</strong> {{ user.id }}</li>
        </ul>
        <div class="mt-4">
          <button class="btn btn-primary me-2" (click)="editProfile()">Modifier le profil</button>
          <button class="btn btn-success me-2" (click)="saveProfile()">Enregistrer</button>
          <button class="btn btn-outline-danger" (click)="logout()">Se déconnecter</button>
        </div>
        
      </div>
    </div>
  </div>
</div>
