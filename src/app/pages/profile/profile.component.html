<div class="container mt-5">
  <div class="card profile-card shadow-lg p-4">
    <div class="row g-4 align-items-center">
      <div class="col-md-3 text-center">
        <img src="https://bootdey.com/img/Content/avatar/avatar1.png" class="img-fluid rounded-circle profile-img" alt="Avatar">
      </div>
      <div class="col-md-9">
        <h3 class="mb-3">Bienvenue, {{ user.nom }} {{ user.prenom }}</h3>
        <ul class="list-group list-group-flush">
          <li class="list-group-item"><strong>Email :</strong> {{ user.email }}</li>
          <li class="list-group-item"><strong>Téléphone :</strong> {{ user.num_tel }}</li>
          <li class="list-group-item"><strong>ID Utilisateur :</strong> {{ user.id }}</li>
        </ul>
        <div class="mt-4">
          <button class="btn btn-primary me-2" (click)="editProfile()">Modifier le profil</button>
          <button class="btn btn-outline-danger" (click)="logout()">Se déconnecter</button>
        </div>
      </div>
    </div>
  </div>
</div>
