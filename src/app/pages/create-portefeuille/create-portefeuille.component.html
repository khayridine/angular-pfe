<div class="container mt-4">
  <div style="margin-bottom: 30px;">
    <span class="back-icon" (click)="goBackWithFlash()"
      style="cursor: pointer; margin-left: 20px; font-size: 20px; color: #2c3e50;">
      <i class="fas fa-arrow-left"></i>
    </span>
    <h3 class="welcome-message" *ngIf="user?.nom" style="margin: 0; color: #1e90ff;">
      Bienvenue, {{ user.prenom }} {{ user.nom }}
    </h3>
  </div>

  <h2>Créer un portefeuille</h2>
  <p class="text-muted">Retrouvez ici un aperçu complet de vos portefeuilles, vos performances, et vos opportunités
    d’optimisation.</p>

  <div class="form-group mt-3">
    <label for="montant">Montant total à investir :</label>
    <input id="montant" class="form-control" type="number" [(ngModel)]="montantTotal">
  </div>

  <div class="mt-4">
    <button class="btn btn-success" (click)="ajouterActif()">Ajouter un actif</button>
  </div>

  <div *ngFor="let actif of actifs; let i = index" class="card mt-3 p-3">
    <div class="form-row row">
      <div class="col-md-2">
        <label>Nom de l’actif</label>
        <input type="text" class="form-control" [(ngModel)]="actif.nom" required>
      </div>
      <div class="col-md-2">
        <label>Catégorie</label>
        <select class="form-control" [(ngModel)]="actif.categorie" required>
          <option value="" disabled selected>Choisir...</option>
          <option>Action</option>
          <option>Crypto</option>
          <option>Obligation</option>
          <option>Matière première</option>
          <option>Immobilier</option>
        </select>
      </div>
      <div class="col-md-2">
        <label>Type précis</label>
        <input type="text" class="form-control" [(ngModel)]="actif.type">
      </div>
      <div class="col-md-2">
        <label>% d’allocation</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="actif.pourcentage"
          required
          min="0.01"
          max="100"
          step="0.01"
        >
      </div>
      <div class="col-md-2">
        <label>Rendement estimé (%)</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="actif.rendement"
          required
          step="0.01"
        >
      </div>
      <div class="col-md-2">
        <label>Volatilité estimée (%)</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="actif.volatilite"
          required
          min="0.01"
          step="0.01"
        >
      </div>
    </div>
    <div class="text-end mt-2">
      <button class="btn btn-danger" (click)="supprimerActif(i)">Supprimer</button>
    </div>
  </div>

  <div class="mt-4">
    <button class="btn btn-info" (click)="afficherAnalyse()">Analyser le portefeuille</button>
  </div>
  <div *ngIf="messageErreur" class="alert alert-danger mt-3">
    {{ messageErreur }}
  </div>

  <div class="alert alert-info mt-3" *ngIf="afficherResultats && messageRendementTitre">
    <h5 class="fw-bold mb-2">{{ messageRendementTitre }}</h5>
    <p class="mb-0">{{ messageRendementTexte }}</p>
  </div>

  <div class="mt-4 d-flex justify-content-center" *ngIf="afficherResultats">
    <div style="max-width: 300px;">
      <canvas baseChart [data]="chartData" [type]="'pie'"></canvas>
    </div>
  </div>

  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-primary" (click)="savePortefeuille()">Enregistrer le portefeuille</button>
    <button class="btn btn-secondary" (click)="resetForm()">Réinitialiser</button>
    <button class="btn btn-outline-dark">Comparer avec un autre portefeuille</button>
  </div>
</div>
